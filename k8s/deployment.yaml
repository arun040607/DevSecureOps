apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecureops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devsecureops
  template:
    metadata:
      labels:
        app: devsecureops
    spec:
      containers:
        - name: devsecureops
          image: devsecureops:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: devsecureops-service
spec:
  type: NodePort
  selector:
    app: devsecureops
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
